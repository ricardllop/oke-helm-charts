# Default values for rllopsite-deploy-helm-chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1
namespace: "rllopsite"
image:
  repository: docker.io/rllopdev/rllopsite
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "ga-2026.10.09-1010"
imagePullSecrets: []
nameOverride: ""
fullnameOverride: "rllopapp"
podAnnotations: {}
podLabels: {}
podSecurityContext: {}
# fsGroup: 2000

securityContext: {}
# capabilities:
#   drop:
#   - ALL
# readOnlyRootFilesystem: true
# runAsNonRoot: true
# runAsUser: 1000

service:
  type: ClusterIP
  port: 80
httpRoute:
  enabled: true
  annotations: {}
  # Shared Gateway of the kgateway chart. It only has an http listener: this chart adds
  # the https listeners for the hostnames below with a ListenerSet, plus their
  # certificate and the http -> https redirect.
  gateway:
    name: public-gateway
    namespace: kgateway-system
    httpListener: http
  hostnames:
    - ricardllop.com
    - www.ricardllop.com
  tls:
    clusterIssuer: letsencrypt-prod
    secretName: ricardllop-com-tls
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
resources: {}
livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80
# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true
nodeSelector: {}
tolerations: []
affinity: {}
