{{- if .Values.httpRoute.enabled -}}
# Redirects http to https on the http listener of the shared Gateway. The hostnames
# are listed explicitly (instead of leaving a catch-all) because routes are grouped
# by hostname: the HTTP-01 challenge route that cert-manager adds for a hostname
# would otherwise shadow a catch-all and that hostname would answer 404 during the
# challenge.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "rllopsite-deploy-helm-chart.fullname" . }}-https-redirect
  labels:
    {{- include "rllopsite-deploy-helm-chart.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.httpRoute.gateway.name }}
      namespace: {{ .Values.httpRoute.gateway.namespace }}
      sectionName: {{ .Values.httpRoute.gateway.httpListener }}
  hostnames:
    {{- toYaml .Values.httpRoute.hostnames | nindent 4 }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
{{- end }}
