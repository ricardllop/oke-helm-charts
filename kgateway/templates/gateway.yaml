apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
spec:
  gatewayClassName: kgateway
  # kgateway sets this as the loadBalancerIP of the Service it creates
  addresses:
    - type: IPAddress
      value: {{ .Values.gateway.loadBalancerIP | quote }}
  infrastructure:
    annotations:
      {{- toYaml .Values.gateway.annotations | nindent 6 }}
  # There is no https listener here: each workload chart adds the https listeners
  # for its own hostnames, with its own certificate, through a ListenerSet
  allowedListeners:
    namespaces:
      from: All
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
